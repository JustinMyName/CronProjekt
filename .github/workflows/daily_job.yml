name: Tägliches Python Skript

on:
  schedule:
    # Syntax: Minute Stunde Tag Monat Wochentag (in UTC-Zeit)
    # Beispiel: Täglich um 08:00 Uhr UTC
    - cron: '0 8 * * *'
  # Erlaubt das manuelle Starten per Button auf GitHub:
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Python-Skript ausführen
        run: python script.py

        - name: Änderungen committen und pushen
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          git add .
          git diff --quiet && git diff --staged --quiet || git commit -m "auto: Daten durch GitHub Action aktualisiert"
          git push